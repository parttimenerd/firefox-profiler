name: CI

on:
  push:
    branches:
      - main
      - production
      - jfrtofp
  pull_request:

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Run lint
        run: yarn lint

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Run tests
        # We use workerIdleMemoryLimit to work around a memory issue with node.
        # See https://github.com/facebook/jest/issues/11956
        run: yarn test --coverage --logHeapUsage -w=4 --workerIdleMemoryLimit=1.5G

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false

  cli-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Run CLI tests
        run: yarn test-cli

  build-prod:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Build production
        run: yarn build-prod:quiet

      - name: Build node tools
        run: yarn build-node-tools

      - name: Upload node-tools-dist artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: node-tools-dist
          path: node-tools-dist/

      - name: Build profiler-cli
        run: yarn build-profiler-cli

      - name: Upload profiler-cli artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: profiler-cli
          path: profiler-cli/dist/

  licence-check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Run license check
        run: yarn license-check

  typecheck:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Run TypeScript check
        run: yarn ts

  alex:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Run alex
        run: yarn test-alex

  yarn-lock:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Check yarn.lock
        run: yarn test-lockfile

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './bin'

  deploy-pages:
    name: Deploy to GitHub Pages (with JFR converter)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/jfrtofp'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout firefox-profiler
        uses: actions/checkout@v5

      - name: Setup GraalVM (Java 25)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Install Binaryen (wasm-as)
        run: |
          sudo apt-get install -y binaryen

      - name: Build jafar WASM
        working-directory: jafar-web
        run: mvn package -DskipTests -q

      - name: Copy WASM into firefox-profiler
        run: |
          cp jafar-web/web/jafar.js \
             src/profile-logic/import/jfr-wasm/
          cp jafar-web/web/jafar.js.wasm \
             src/profile-logic/import/jfr-wasm/

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Build with JFR converter
        run: yarn build-prod

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
