name: CI

on:
  push:
    branches:
      - main
      - production
      - jfrtofp
  pull_request:

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Run lint
        run: yarn lint

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Run tests
        # We use workerIdleMemoryLimit to work around a memory issue with node.
        # See https://github.com/facebook/jest/issues/11956
        run: yarn test --coverage --logHeapUsage -w=4 --workerIdleMemoryLimit=1.5G

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false

  cli-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Run CLI tests
        run: yarn test-cli

  build-prod:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Build production
        run: yarn build-prod:quiet

      - name: Build node tools
        run: yarn build-node-tools

      - name: Upload node-tools-dist artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: node-tools-dist
          path: node-tools-dist/

      - name: Build profiler-cli
        run: yarn build-profiler-cli

      - name: Upload profiler-cli artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: profiler-cli
          path: profiler-cli/dist/

  licence-check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Run license check
        run: yarn license-check

  typecheck:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Run TypeScript check
        run: yarn ts

  alex:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Run alex
        run: yarn test-alex

  yarn-lock:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Check yarn.lock
        run: yarn test-lockfile

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './bin'

  deploy-pages:
    name: Deploy to GitHub Pages (with JFR converter)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/jfrtofp'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout firefox-profiler
        uses: actions/checkout@v5

      - name: Setup GraalVM (Java 25)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Install Binaryen (wasm-as)
        run: |
          BINARYEN_VERSION=129
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | sudo tar -xz -C /usr/local --strip-components=1

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Build and install condensed-data reader JAR
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/parttimenerd/condensed-data.git /tmp/condensed-data
          python3 /tmp/condensed-data/bin/build-reader-jar.py --install

      - name: Build jafar WASM
        run: yarn build-jfr-wasm

      - name: Record example JFR (Renaissance akka-uct, ~30s)
        run: |
          set -euo pipefail
          mkdir -p /tmp/jfr-out
          # Renaissance is a JVM benchmark suite distributed as a fat jar.
          curl -fsSL -o /tmp/renaissance.jar \
            https://github.com/renaissance-benchmarks/renaissance/releases/download/v0.16.1/renaissance-gpl-0.16.1.jar
          # Use a Temurin JDK (Renaissance 0.16.1 supports Java 11–21; pin to 21
          # so JFR output is current). The graalvm step above already set up
          # GraalVM 25, but Renaissance fails to launch on it.
          curl -fsSL -o /tmp/jdk.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse?project=jdk"
          mkdir -p /tmp/jdk
          tar -xzf /tmp/jdk.tar.gz -C /tmp/jdk --strip-components=1
          # Run akka-uct under JFR for 30s. Renaissance accepts -r 1 to limit
          # to one repetition; the JFR duration is the primary cap.
          /tmp/jdk/bin/java \
            -XX:StartFlightRecording=duration=30s,filename=/tmp/jfr-out/akka-uct.jfr,settings=profile \
            -jar /tmp/renaissance.jar -r 1 akka-uct
          ls -lh /tmp/jfr-out/akka-uct.jfr

      - name: Build with JFR converter
        run: yarn build-prod
        env:
          PUBLIC_PATH: /firefox-profiler/

      - name: Copy example JFR into dist/
        run: |
          mkdir -p dist/example-profiles
          cp /tmp/jfr-out/akka-uct.jfr dist/example-profiles/akka-uct.jfr
          ls -lh dist/example-profiles/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
